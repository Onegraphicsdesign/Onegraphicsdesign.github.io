name: Rename shirt prototype to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and remove this workflow
        run: |
          mv -f shirt-prototype.html index.html
          rm -f .github/workflows/rename-to-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace index.html with new shirt designer"
          git push
