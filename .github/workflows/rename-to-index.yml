name: Rename prototype to index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-to-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename shirt-prototype.html to index.html and remove this workflow
        run: |
          set -e
          if [ ! -f shirt-prototype.html ]; then
            echo "shirt-prototype.html not found"
            exit 1
          fi
          mv shirt-prototype.html index.html
          rm -f .github/workflows/rename-to-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Replace index.html with new shirt designer"
          git push
