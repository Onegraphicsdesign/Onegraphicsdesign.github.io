name: Rename prototype to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename shirt-prototype.html to index.html and remove this workflow
        run: |
          mv shirt-prototype.html index.html
          rm .github/workflows/rename-to-index.yml
          git config user.name "Onegraphicsdesign"
          git config user.email "oneonegraphics@gmail.com"
          git add -A
          git commit -m "Replace index.html with new shirt designer; remove temporary workflow"
          git push
