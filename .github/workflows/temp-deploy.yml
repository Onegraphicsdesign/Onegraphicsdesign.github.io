name: Temporary deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and clean up
        run: |
          if [ ! -f shirt-prototype.html ]; then
            echo "No shirt-prototype.html found, nothing to do."
            exit 0
          fi
          mv shirt-prototype.html index.html
          rm -f .github/workflows/temp-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with new shirt designer; remove temporary workflow" || exit 0
          git push
