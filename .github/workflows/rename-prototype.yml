name: Rename prototype to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new prototype
        run: |
          mv shirt-prototype.html index.html
          git config user.name "Onegraphicsdesign"
          git config user.email "onegraphicsdesign@users.noreply.github.com"
          git add -A
          git commit -m "Update index.html with Wix favicon"
          git push
