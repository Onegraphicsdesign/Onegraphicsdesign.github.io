name: Rename prototype to index
on:
  push:
    paths:
      - '.github/workflows/rename-prototype.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename prototype to index
        run: |
          if [ ! -f shirt-prototype.html ]; then
            echo "shirt-prototype.html not found" >&2
            exit 1
          fi
          mv shirt-prototype.html index.html
          rm .github/workflows/rename-prototype.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update index.html: customer info step + weights"
          git push
