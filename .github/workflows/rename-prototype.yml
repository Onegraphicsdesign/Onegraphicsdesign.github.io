name: Rename prototype to index

on:
  push:
    paths:
      - '.github/workflows/rename-prototype.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename shirt-prototype.html to index.html
        run: |
          if [ -f shirt-prototype.html ]; then
            mv shirt-prototype.html index.html
            rm .github/workflows/rename-prototype.yml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update index.html: updated T-shirt designer"
            git push
          fi
