name: Rename prototype to index.html

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-prototype.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new prototype
        run: |
          if [ ! -f shirt-prototype.html ]; then
            echo "shirt-prototype.html not found" >&2
            exit 1
          fi
          mv shirt-prototype.html index.html
          rm -- .github/workflows/rename-prototype.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update index.html: animated check + chime on thank-you screen"
          git push
