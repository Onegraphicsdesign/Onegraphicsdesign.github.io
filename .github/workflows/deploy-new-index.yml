name: Replace index with new designer
on:
  push:
    branches: [main]
    paths:
      - 'shirt-prototype.html'
      - '.github/workflows/deploy-new-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and remove temporary files
        run: |
          test -f shirt-prototype.html
          mv shirt-prototype.html index.html
          rm -f .github/workflows/deploy-new-index.yml
      - name: Commit replacement and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          git add -A
          git commit -m "Replace index.html with new shirt designer; remove temporary workflow"
          git push
