name: Replace index.html with shirt prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html and remove this workflow
        run: |
          mv shirt-prototype.html index.html
          rm .github/workflows/replace-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with new shirt designer; remove temporary workflow"
          git push

