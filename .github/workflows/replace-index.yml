name: Replace index with prototype
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with prototype and remove this workflow
        run: |
          test -f shirt-prototype.html || exit 0
          mv shirt-prototype.html index.html
          rm -f .github/workflows/replace-index.yml
          git config user.name "Onegraphicsdesign"
          git config user.email "onegraphicsdesign@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with new shirt designer; remove temporary workflow"
          git push
